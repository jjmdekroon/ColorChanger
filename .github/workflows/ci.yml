name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  native-tests:
    name: Host-side Unity tests (pio test -e native)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install PlatformIO
        run: pip install platformio

      - name: Run native tests
        run: pio test -e native --verbose

  build-master:
    name: Build master firmware
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build master
        run: pio run -e master

  build-slave:
    name: Build slave firmware
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build slave
        run: pio run -e slave
