# PlatformIO Multi-Environment Configuration for Multi-Material Upgrade
# Master (ESP32-C3), Slave (ESP32-C3), and Host-side Native Tests (Unity)

[platformio]
default_envs = native
src_dir = .
test_dir = test/native

# ==============================================================================
# MASTER ENVIRONMENT: Firmware for main controller (SEEED XIAO ESP32-C3)
# ==============================================================================
[env:master]
platform = espressif32@6.4.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
monitor_port = COM*

# Source and include paths
src_filter = +<master/src/> +<shared/>
build_flags = 
    -Imaster/include
    -Ishared
    -std=c++17
    -DMASTER_BUILD
    -Wall
    -Wextra

# Dependencies with pinned versions per research.md R-001/R-002/R-003/R-004
lib_deps =
    TMCStepper@0.7.3
    madhephaestus/ESP32Servo@0.12.1
    adafruit/Adafruit NeoPixel@1.11.0
    ArduinoJson@6.21.3

# Static analysis
check_tool = clangtidy
check_flags = clangtidy: --checks=-*,readability-*,bugprone-*,cppcoreguidelines-*

# ==============================================================================
# SLAVE ENVIRONMENT: Firmware for slave modules (SEEED XIAO ESP32-C3)
# ==============================================================================
[env:slave]
platform = espressif32@6.4.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
monitor_port = COM*

# Source and include paths
src_filter = +<slave/src/> +<shared/>
build_flags = 
    -Islave/include
    -Ishared
    -std=c++17
    -DSLAVE_BUILD
    -Wall
    -Wextra

# Dependencies with pinned versions
lib_deps =
    madhephaestus/ESP32Servo@0.12.1
    adafruit/Adafruit NeoPixel@1.11.0
    ArduinoJson@6.21.3

# Static analysis
check_tool = clangtidy
check_flags = clangtidy: --checks=-*,readability-*,bugprone-*,cppcoreguidelines-*

# ==============================================================================
# NATIVE ENVIRONMENT: Host-side tests (Unity framework for contract/FSM tests)
# ==============================================================================
[env:native]
platform = native
test_framework = unity
build_flags = 
    -DNATIVE_TEST
    -std=c++17
    -Wall
    -Wextra
    -O0
    -g

# Test-specific include paths
src_filter = +<shared/> +<test/native/>
lib_deps =
    ArduinoJson@6.21.3
