# ==============================================================================
# Klipper MMU Tool-Change Macros
# Per contracts/usb-serial.md, FR-001..FR-005, FR-003c
#
# Commands sent to MultiMaterial Master via USB-serial:
# - T<0-15>: Change to tool N (load from slave N, unload previous)
# - L<0-15>: Load slave N directly into hotend (no tool-change)
# - U<0-15>: Unload slave N from hotend  
# - R: Reset all slaves
# - S: Query status
#
# Responses: ok, algeladen, busy, fail<n>, or status line
#
# fail<n> mapping per contracts/usb-serial.md §"Error code table":
#   fail1  = bad opcode
#   fail2  = bad index (invalid slave number)
#   fail3  = slave offline / in FAULT state (FR-009)
#   fail4  = illegal state transition
#   fail16 = feed timeout (FR-011 exhausted after 3× retry)
#   fail17 = sensor stuck open (FR-009 sensor variant)
#   fail32 = I2C bus timeout (FR-017 exhausted after 3× retry)
#   fail48 = max-1-coupled invariant violated
#   fail255 = internal error
#
# On fail<n>: macro calls PAUSE + RESPOND TYPE=error (FR-003c)
# On busy: retry up to BUSY_RETRY_MAX times with BUSY_RETRY_HINT_MS delay
# ==============================================================================

[gcode_macro _MMU_HANDLE_FAIL]
description: Internal - parse fail<n> and invoke PAUSE with human-readable message
gcode:
    {% set n = params.CODE | int(-1) %}
    {% if n == 1 %}
        {% set msg = "MMU bad opcode (fail1)" %}
    {% elif n == 2 %}
        {% set msg = "MMU bad index — invalid slave number (fail2)" %}
    {% elif n == 3 %}
        {% set msg = "MMU slave offline or in FAULT state (fail3) — use MMU_RESET to clear" %}
    {% elif n == 4 %}
        {% set msg = "MMU illegal state transition (fail4)" %}
    {% elif n == 16 %}
        {% set msg = "MMU feed timeout — filament did not reach sensor after 3 retries (fail16)" %}
    {% elif n == 17 %}
        {% set msg = "MMU sensor stuck open — filament detected while gripper open (fail17)" %}
    {% elif n == 32 %}
        {% set msg = "MMU I2C bus error — slave did not respond after 3 retries (fail32)" %}
    {% elif n == 48 %}
        {% set msg = "MMU invariant violated — only one tool can be loaded at a time (fail48)" %}
    {% elif n == 255 %}
        {% set msg = "MMU internal error (fail255)" %}
    {% else %}
        {% set msg = "MMU unknown error code: fail" ~ n %}
    {% endif %}
    RESPOND TYPE=error MSG="{msg}"
    PAUSE

[gcode_macro T0]
gcode:
    # Change to tool 0 — blocks until ok/algeladen/fail (FR-012)
    {% set result = call_mmu_command("T0") %}
    {% if result == "ok" or result == "algeladen" %}
        # Success — G-code continues at next line without re-init (FR-012)
    {% elif result | regex_search("^fail(\\d+)$") %}
        {% set n = result[4:] | int %}
        _MMU_HANDLE_FAIL CODE={n}  # FR-003c
    {% else %}
        RESPOND TYPE=error MSG="MMU unexpected response: {result}"
    {% endif %}

[gcode_macro T1]
gcode:
    {% set result = call_mmu_command("T1") %}
    {% if result == "ok" or result == "algeladen" %}
    {% elif result | regex_search("^fail(\\d+)$") %}
