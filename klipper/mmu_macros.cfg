# ==============================================================================
# Klipper MMU Direct Load/Eject/Reset/Status Macros
# Per FR-021, FR-022, and contracts/usb-serial.md
#
# Standalone commands that don't perform tool-change:
# - MMU_LOAD INDEX=<0-15>: Load filament from slave N into hotend
# - MMU_EJECT INDEX=<0-15>: Eject filament from hotend (slave stays loaded)
# - MMU_RESET: Reset all slaves to initial state
# - MMU_STATUS: Query current MMU state
# ==============================================================================

[gcode_macro MMU_LOAD]
description: Load filament from specified slave into hotend (no tool-change)
gcode:
    {% set index = params.INDEX | int %}
    
    {% if index < 0 or index >= 16 %}
        RESPOND TYPE=error MSG="Invalid slave index: {index}"
        {% return %}
    {% endif %}
    
    # Send L<index> command to MMU
    {% set result = call_mmu_command("L{index}") %}
    {% if result != "ok" %}
        RESPOND TYPE=error MSG="MMU load error: {result}"
    {% else %}
        RESPOND TYPE=command MSG="Filament loaded from slave {index}"
    {% endif %}

[gcode_macro MMU_EJECT]
description: Eject filament from hotend without changing tool
gcode:
    {% set index = params.INDEX | int %}
    
    {% if index < 0 or index >= 16 %}
        RESPOND TYPE=error MSG="Invalid slave index: {index}"
        {% return %}
    {% endif %}
    
    # Send U<index> command to MMU
    {% set result = call_mmu_command("U{index}") %}
    {% if result != "ok" %}
        RESPOND TYPE=error MSG="MMU eject error: {result}"
    {% else %}
        RESPOND TYPE=command MSG="Filament ejected from slave {index}"
    {% endif %}

[gcode_macro MMU_RESET]
description: Reset all MMU slaves to initial state
gcode:
    # Send R command
    {% set result = call_mmu_command("R") %}
    {% if result != "ok" %}
        RESPOND TYPE=error MSG="MMU reset error: {result}"
    {% else %}
        RESPOND TYPE=command MSG="MMU reset complete"
    {% endif %}

[gcode_macro MMU_STATUS]
description: Query current MMU status
gcode:
    # Send S command
    {% set result = call_mmu_command("S") %}
    
    # Parse response:
    # Format: state=<N> coupled=<idx|none> slaves=<count> tool=<idx|none>
    
    RESPOND TYPE=command MSG="MMU status: {result}"
    
    # TODO: Parse and display formatted response

